<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="cat /certs/*">
  <title>cat /certs/*</title>
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cur { animation: b 1.1s steps(1) infinite; }
      @keyframes b { 50% { opacity: 0; } }
      .run { animation: run 4.5s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(1060px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="p" x1="0" x2="1">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>
  <text class="m" x="0" y="38" font-size="15" fill="#8b949e">[0x04]</text>
  <text class="m" x="72" y="38" font-size="15" fill="#2ea043">$</text>
  <text class="m" x="92" y="38" font-size="28" font-weight="700" fill="#2ea043" letter-spacing="1">cat /certs/*</text>
  <rect class="cur" x="318" y="17" width="14" height="26" fill="#2ea043"/>
  <text class="m" x="1200" y="38" font-size="14" fill="#8b949e" text-anchor="end">// certificações</text>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#8b949e" stroke-opacity=".35"/>
  <rect class="run" x="0" y="59" width="140" height="3" rx="1.5" fill="url(#p)"/>
</svg>
